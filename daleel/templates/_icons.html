{% macro icon(name, size=14) -%}

{% elif name == 'video' %}<rect x="3" y="5" width="18" height="14" rx="1"/><path d="m10 9 5 3-5 3Z" fill="currentColor"/>
{% elif name == 'person' %}<circle cx="12" cy="7" r="3"/><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/>

{% elif name == 'map' %}<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/>

{% elif name == 'panel-open' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m4-12 4 4-4 4"/>
{% elif name == 'history' %}<path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v5l3 2"/>
